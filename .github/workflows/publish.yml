name: IG Publisher
on:
  schedule:
    - cron: '0 6 * * *'    # 09:00 Athens
    - cron: '30 11 * * *'  # 14:30 Athens
    - cron: '30 17 * * *'  # 20:30 Athens
  workflow_dispatch:        # run manually from the Actions tab
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/ig_publish.py
        env:
          IG_TOKEN:  ${{ secrets.IG_TOKEN }}
          IG_USERID: ${{ secrets.IG_USERID }}
      - run: |
          git config user.name  "ig-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || git commit -m "mark published [skip ci]"
          git push
